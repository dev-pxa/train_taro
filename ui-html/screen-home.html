    // 生成课程卡片HTML
    function createCourseCard(course) {
      const durationIcon = course.type === 'series'
        ? `<svg width="12" height="12" viewBox="0 0 24 24" fill="none">
             <path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
             <path d="M6.5 2H20V22H6.5A2.5 2.5 0 0 0 4 19.5V4.5A2.5 2.5 0 0 1 6.5 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
           </svg>`
        : `<svg width="12" height="12" viewBox="0 0 24 24" fill="none">
             <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
             <path d="M12 6V12L16 14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
           </svg>`;

      return `
        <div class="course-card" data-id="${course.id}">
          <div class="course-cover-wrapper">
            <img class="course-cover" src="${course.coverImage}" alt="${course.title}" />
            <div class="course-cover-overlay"></div>
            <span class="course-label">${course.label}</span>
            <div class="course-duration">
              ${durationIcon}
              <span>${course.duration}</span>
            </div>
          </div>
          <div class="course-info">
            <h3 class="course-title">${course.title}</h3>
          </div>
        </div>
      `;
    }

    // 渲染课程列表
    function renderCourses() {
      const courseGrid = document.getElementById('courseGrid');
      const certGrid = document.getElementById('certGrid');

      if (courseGrid) {
        // 前3个课程放岗位必修
        const jobCourses = courses.slice(0, 3);
        courseGrid.innerHTML = jobCourses.map(createCourseCard).join('');
      }

      if (certGrid) {
        // 后3个课程放专业证书
        const certCourses = courses.slice(3, 6);
        certGrid.innerHTML = certCourses.map(createCourseCard).join('');
      }
    }

    // 轮播图功能
    document.addEventListener('DOMContentLoaded', function() {
      const carousel = document.getElementById('carousel');
      const track = document.getElementById('carouselTrack');
      const dots = document.querySelectorAll('.carousel-dot');
      let currentIndex = 0;
      let autoPlayInterval;

      function goToSlide(index) {
        if (index < 0) index = 2;
        if (index > 2) index = 0;
        currentIndex = index;
        if (track) {
          track.style.transform = `translateX(-${index * 100}%)`;
        }
        updateDots();
      }

      function updateDots() {
        dots.forEach((dot, index) => {
          dot.classList.toggle('active', index === currentIndex);
        });
      }

      function nextSlide() {
        goToSlide(currentIndex + 1);
      }

      function startAutoPlay() {
        autoPlayInterval = setInterval(nextSlide, 3500);
      }

      function stopAutoPlay() {
        clearInterval(autoPlayInterval);
      }

      dots.forEach((dot, index) => {
        dot.addEventListener('click', () => {
          goToSlide(index);
          stopAutoPlay();
          startAutoPlay();
        });
      });

      if (carousel) {
        carousel.addEventListener('mouseenter', stopAutoPlay);
        carousel.addEventListener('mouseleave', startAutoPlay);

        let touchStartX = 0;
        let touchEndX = 0;

        carousel.addEventListener('touchstart', (e) => {
          touchStartX = e.changedTouches[0].screenX;
          stopAutoPlay();
        }, { passive: true });

        carousel.addEventListener('touchend', (e) => {
          touchEndX = e.changedTouches[0].screenX;
          const diff = touchStartX - touchEndX;
          if (Math.abs(diff) > 50) {
            if (diff > 0) {
              goToSlide(currentIndex + 1);
            } else {
              goToSlide(currentIndex - 1);
            }
          }
          startAutoPlay();
        }, { passive: true });
      }

      startAutoPlay();
      renderCourses();
    });
  </script>
