    :root {

      --surface: #ffffff;

      --fg-2: #4b5563;
      --muted: #667085;
      --border: #e7e8ee;
      --accent: #4f8ef7;
      --accent-2: #7c6efc;
      --accent-on: #ffffff;
      --accent-hover: #3a7de6;
      --accent-active: #2c6ed1;
      --success: #10b981;
      --success-soft: rgba(16, 185, 129, 0.1);
      --warn: #f59e0b;
      --danger: #ef4444;

      --font-display: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif;
      --font-body: "SF Pro Text", -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif;
      --font-mono: "SF Mono", ui-monospace, "JetBrains Mono", Menlo, monospace;

      --text-xs: 12px;
      --text-sm: 14px;
      --text-base: 16px;
      --text-lg: 18px;
      --text-xl: 22px;
      --text-2xl: 28px;
      --text-3xl: 36px;
      --text-4xl: 48px;

      --leading-body: 1.5;
      --leading-tight: 1.2;
      --tracking-display: -0.01em;

      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --space-8: 32px;
      --space-12: 48px;

      --radius-sm: 8px;
      --radius-md: 16px;
      --radius-lg: 20px;
      --radius-xl: 28px;
      --radius-pill: 9999px;

      --elev-flat: none;
      --elev-ring: 0 0 0 1px var(--border);
      --elev-raised: 0 4px 24px rgba(0, 0, 0, 0.06);
      --elev-soft: 0 2px 12px rgba(0, 0, 0, 0.04);

      --focus-ring: 0 0 0 4px rgba(79, 142, 247, 0.15);

      --gradient-primary: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
      --gradient-soft: linear-gradient(135deg, rgba(79, 142, 247, 0.08) 0%, rgba(124, 110, 252, 0.08) 100%);
      --gradient-hero: linear-gradient(135deg, rgba(79, 142, 247, 0.12) 0%, rgba(124, 110, 252, 0.12) 100%);

      --motion-fast: 150ms;
      --motion-base: 220ms;
      --ease-standard: cubic-bezier(0.28, 0, 0.22, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-body);
      font-size: var(--text-base);
      line-height: var(--leading-body);
      color: var(--fg);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .phone-container {
      width: 393px;
      height: 852px;
      margin: 0 auto;
      background: var(--bg);
      position: relative;
      overflow: hidden;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.15);
      border-radius: 48px;
      display: flex;
      flex-direction: column;
    }

    .phone-status-bar {
      height: 47px;
      padding: 12px 28px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: var(--text-sm);
      font-weight: 600;
      font-family: var(--font-display);
      flex-shrink: 0;
    }

    .phone-notch {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 150px;
      height: 32px;
      background: #000;
      border-radius: 20px;
      z-index: 10;
    }

    .phone-content {
      flex: 1;
      overflow-y: auto;
      padding-bottom: 0;
      -webkit-overflow-scrolling: touch;
    }

    .scroll-content {
      padding: var(--space-5);
      padding-bottom: 100px;
    }

    .phone-home-indicator {
      height: 34px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 8px;
      flex-shrink: 0;
      background: var(--surface);
    }

    .home-indicator-bar {
      width: 134px;
      height: 5px;
      background: var(--fg);
      border-radius: 100px;
      opacity: 0.3;
    }

    /* 导航栏 */
    .nav-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--space-5);
    }

    .nav-back {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-md);
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--fg);
      text-decoration: none;
      box-shadow: var(--elev-soft);
      transition: all var(--motion-base) var(--ease-standard);
    }

    .nav-back:hover {
      transform: translateY(-2px);
      box-shadow: var(--elev-raised);
    }

    .nav-title {
      font-family: var(--font-display);
      font-size: var(--text-xl);
      font-weight: 700;
    }

    .nav-action {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--fg);
      text-decoration: none;
    }

    /* 分类筛选 */
    .category-tabs {
      display: flex;
      gap: var(--space-2);
      margin-bottom: var(--space-5);
      overflow-x: auto;
      padding-bottom: 4px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .category-tabs::-webkit-scrollbar {
      display: none;
    }

    .category-tab {
      flex-shrink: 0;
      padding: 10px 18px;
      border-radius: var(--radius-pill);
      font-size: var(--text-sm);
      font-weight: 500;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all var(--motion-base) var(--ease-standard);
    }

    .category-tab:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .category-tab.active {
      background: var(--gradient-primary);
      color: white;
      border-color: transparent;
      box-shadow: 0 4px 12px rgba(79, 142, 247, 0.3);
    }

    /* 筛选排序栏 */
    .filter-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--space-4);
    }

    .filter-result {
      font-size: var(--text-sm);
      color: var(--muted);
    }

    .filter-sort {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 6px 12px;
      background: var(--surface);
      border-radius: var(--radius-pill);
      font-size: var(--text-sm);
      color: var(--fg-2);
      cursor: pointer;
      transition: all var(--motion-base) var(--ease-standard);
    }

    .filter-sort:hover {
      background: var(--gradient-soft);
      color: var(--accent);
    }

    /* 课程网格 */
    .course-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-4);
    }

    .course-card {
      background: var(--surface);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
      transition: transform var(--motion-base) var(--ease-standard),
                  box-shadow var(--motion-base) var(--ease-standard);
      cursor: pointer;
    }

    .course-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
    }

    .course-cover-wrapper {
      position: relative;
      width: 100%;
      height: 128px;
      overflow: hidden;
    }

    .course-cover {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s var(--ease-standard);
    }

    .course-card:hover .course-cover {
      transform: scale(1.05);
    }

    .course-cover-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(to bottom, rgba(0,0,0,0) 50%, rgba(0,0,0,0.3) 100%);
    }

    .course-label {
      position: absolute;
      top: 10px;
      left: 10px;
      padding: 4px 10px;
      background: linear-gradient(135deg, rgba(79, 142, 247, 0.95) 0%, rgba(124, 110, 252, 0.95) 100%);

      font-size: 11px;
      font-weight: 600;
      border-radius: 8px;
      letter-spacing: 0.2px;
      box-shadow: 0 2px 8px rgba(79, 142, 247, 0.3);
    }

    .course-duration {
      position: absolute;
      bottom: 10px;
      right: 10px;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: white;
      font-size: 11px;
      font-weight: 500;
      border-radius: 6px;
    }

    .course-duration svg {
      width: 12px;
      height: 12px;
    }

    .course-info {
      padding: 14px;
    }

    .course-title {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.4;
      color: var(--fg);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* 底部导航 */
    .tab-bar {
      position: absolute;
      bottom: 34px;
      left: 0;
      right: 0;
      height: 84px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      justify-content: space-around;
      align-items: flex-start;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }

    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--muted);
      text-decoration: none;
      font-size: var(--text-xs);
      transition: color var(--motion-base) var(--ease-standard);
    }

    .tab-item.active {
      color: var(--accent);
    }

    .tab-icon {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .page-nav {
      display: flex;
      justify-content: center;
      gap: var(--space-4);
      margin-top: var(--space-4);
      padding-top: var(--space-6);
      border-top: 1px solid var(--border);
    }

    .nav-btn {
      padding: var(--space-3) var(--space-5);
      border-radius: var(--radius-pill);
      font-size: var(--text-sm);
      font-weight: 500;
      text-decoration: none;
      color: var(--fg-2);
      background: var(--surface);
      border: 1px solid var(--border);
      transition: all var(--motion-base) var(--ease-standard);
    }

    .nav-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .nav-btn.active {
      background: var(--gradient-soft);
      color: var(--accent);
      border-color: transparent;
      font-weight: 600;
    }

    /* 空状态 */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--space-12) var(--space-5);
      text-align: center;
    }

    .empty-icon {
      width: 80px;
      height: 80px;
      border-radius: var(--radius-xl);
      background: var(--gradient-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      margin-bottom: var(--space-4);
    }

    .empty-title {
      font-size: var(--text-lg);
      font-weight: 600;
      margin-bottom: var(--space-2);
    }

    .empty-text {
      font-size: var(--text-sm);
      color: var(--muted);
    }

    /* 加载状态 */
    .loading-skeleton {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-4);
    }

    .skeleton-card {
      background: var(--surface);
      border-radius: 20px;
      overflow: hidden;
    }

    .skeleton-cover {
      width: 100%;
      height: 128px;
      background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
      background-size: 200% 100%;
      animation: skeleton-loading 1.5s infinite;
    }

    .skeleton-info {
      padding: 14px;
    }

    .skeleton-title {
      height: 16px;
      background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
      background-size: 200% 100%;
      border-radius: 4px;
      animation: skeleton-loading 1.5s infinite;
    }

    @keyframes skeleton-loading {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    @media (max-width: 430px) {
      .phone-container {
        width: 100%;
        height: 100vh;
        border-radius: 0;
        box-shadow: none;
      }
    }

      const courseGrid = document.getElementById('courseGrid');
      const filterResult = document.getElementById('filterResult');

      let filteredCourses = courses;
      if (category !== 'all') {
        filteredCourses = courses.filter(c => c.category === category);
      }

      if (filteredCourses.length === 0) {
        courseGrid.innerHTML = `
          <div class="empty-state" style="grid-column: 1 / -1;">
            <div class="empty-icon">📚</div>
            <h3 class="empty-title">暂无课程</h3>
            <p class="empty-text">该分类下暂时没有课程，去其他分类看看吧</p>
          </div>
        `;
      } else {
        courseGrid.innerHTML = filteredCourses.map(createCourseCard).join('');
      }

      filterResult.textContent = `共 ${filteredCourses.length} 门课程`;

          tabs.forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          const category = tab.dataset.category;
          renderCourses(category);
        });
      });
    }

    function getUrlParam(name) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(name);
    }

    // 初始化
    document.addEventListener('DOMContentLoaded', function() {
      const typeParam = getUrlParam('type');
      const pageTitle = document.getElementById('pageTitle');

      // 根据参数设置页面标题和默认分类
      let defaultCategory = 'all';
      if (typeParam === 'job') {
        pageTitle.textContent = '岗位必修';
        defaultCategory = 'job';
      } else if (typeParam === 'cert') {
        pageTitle.textContent = '专业证书';
        defaultCategory = 'cert';
      }

      // 设置默认分类
      const tabs = document.querySelectorAll('.category-tab');
      tabs.forEach(tab => {
        if (tab.dataset.category === defaultCategory) {
          tabs.forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
        }
      });

      initCategoryTabs();
      renderCourses(defaultCategory);
    });
