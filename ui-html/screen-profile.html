<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>企训通 - 我的</title>
  <style>
    :root {
      --bg: #f8f9fb;
      --surface: #ffffff;
      --fg: #1a1a1a;
      --fg-2: #4b5563;
      --muted: #667085;
      --border: #e7e8ee;
      --accent: #4f8ef7;
      --accent-2: #7c6efc;
      --accent-on: #ffffff;
      --accent-hover: #3a7de6;
      --accent-active: #2c6ed1;
      --success: #10b981;
      --success-soft: rgba(16, 185, 129, 0.1);
      --warn: #f59e0b;
      --danger: #ef4444;
      --danger-soft: rgba(239, 68, 68, 0.08);

      --font-display: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif;
      --font-body: "SF Pro Text", -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif;
      --font-mono: "SF Mono", ui-monospace, "JetBrains Mono", Menlo, monospace;

      --text-xs: 12px;
      --text-sm: 14px;
      --text-base: 16px;
      --text-lg: 18px;
      --text-xl: 22px;
      --text-2xl: 28px;
      --text-3xl: 36px;
      --text-4xl: 48px;

      --leading-body: 1.5;
      --leading-tight: 1.2;
      --tracking-display: -0.01em;

      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --space-8: 32px;
      --space-12: 48px;

      --radius-sm: 8px;
      --radius-md: 16px;
      --radius-lg: 20px;
      --radius-xl: 28px;
      --radius-pill: 9999px;

      --elev-flat: none;
      --elev-ring: 0 0 0 1px var(--border);
      --elev-raised: 0 4px 24px rgba(0, 0, 0, 0.06);
      --elev-soft: 0 2px 12px rgba(0, 0, 0, 0.04);

      --focus-ring: 0 0 0 4px rgba(79, 142, 247, 0.15);

      --gradient-primary: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
      --gradient-soft: linear-gradient(135deg, rgba(79, 142, 247, 0.08) 0%, rgba(124, 110, 252, 0.08) 100%);

      --motion-fast: 150ms;
      --motion-base: 220ms;
      --ease-standard: cubic-bezier(0.28, 0, 0.22, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-body);
      font-size: var(--text-base);
      line-height: var(--leading-body);
      color: var(--fg);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .phone-container {
      width: 393px;
      height: 852px;
      margin: 0 auto;
      background: var(--bg);
      position: relative;
      overflow: hidden;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.15);
      border-radius: 48px;
      display: flex;
      flex-direction: column;
    }

    .phone-status-bar {
      height: 47px;
      padding: 12px 28px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: var(--text-sm);
      font-weight: 600;
      font-family: var(--font-display);
      flex-shrink: 0;
    }

    .phone-notch {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 150px;
      height: 32px;
      background: #000;
      border-radius: 20px;
      z-index: 10;
    }

    .phone-content {
      flex: 1;
      overflow-y: auto;
      padding-bottom: 0;
      -webkit-overflow-scrolling: touch;
    }

    .scroll-content {
      padding: var(--space-5);
      padding-bottom: 100px;
    }

    .phone-home-indicator {
      height: 34px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 8px;
      flex-shrink: 0;
      background: var(--surface);
    }

    .home-indicator-bar {
      width: 134px;
      height: 5px;
      background: var(--fg);
      border-radius: 100px;
      opacity: 0.3;
    }

    .profile-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--space-6);
    }

    .profile-info {
      display: flex;
      align-items: center;
      gap: var(--space-4);
    }

    .avatar-large {
      width: 72px;
      height: 72px;
      border-radius: var(--radius-xl);
      background: var(--gradient-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: var(--text-2xl);
      box-shadow: 0 12px 32px rgba(79, 142, 247, 0.3);
    }

    .user-details h2 {
      font-family: var(--font-display);
      font-size: var(--text-2xl);
      font-weight: 700;
      letter-spacing: var(--tracking-display);
      margin-bottom: 4px;
    }

    .user-role {
      font-size: var(--text-sm);
      color: var(--muted);
    }

    .edit-btn {
      padding: 8px 16px;
      border-radius: var(--radius-pill);
      background: var(--surface);
      border: 1px solid var(--border);
      font-size: var(--text-sm);
      font-weight: 500;
      color: var(--fg-2);
      cursor: pointer;
      transition: all var(--motion-base) var(--ease-standard);
    }

    .edit-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .stats-card {
      background: var(--surface);
      border-radius: var(--radius-xl);
      padding: var(--space-5);
      margin-bottom: var(--space-6);
      box-shadow: var(--elev-soft);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--space-4);
    }

    .stat-item {
      text-align: center;
    }

    .stat-value {
      font-family: var(--font-display);
      font-size: var(--text-2xl);
      font-weight: 700;
      color: var(--fg);
      margin-bottom: 4px;
    }

    .stat-label {
      font-size: var(--text-xs);
      color: var(--muted);
    }

    .section-title {
      font-family: var(--font-display);
      font-size: var(--text-xl);
      font-weight: 700;
      margin-bottom: var(--space-4);
    }

    .recent-list {
      margin-bottom: var(--space-6);
    }

    .recent-item {
      background: var(--surface);
      border-radius: var(--radius-lg);
      padding: var(--space-4);
      display: flex;
      align-items: center;
      gap: var(--space-4);
      margin-bottom: var(--space-3);
      box-shadow: var(--elev-soft);
      transition: transform var(--motion-base) var(--ease-standard),
                  box-shadow var(--motion-base) var(--ease-standard);
      cursor: pointer;
    }

    .recent-item:hover {
      transform: translateY(-1px);
      box-shadow: var(--elev-raised);
    }

    .recent-thumb {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 20px;
      flex-shrink: 0;
    }

    .recent-details {
      flex: 1;
      min-width: 0;
    }

    .recent-title {
      font-size: var(--text-sm);
      font-weight: 600;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .recent-meta {
      font-size: var(--text-xs);
      color: var(--muted);
    }

    .recent-play {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--gradient-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      flex-shrink: 0;
    }

    .menu-group {
      background: var(--surface);
      border-radius: var(--radius-xl);
      box-shadow: var(--elev-soft);
      overflow: hidden;
      margin-bottom: var(--space-5);
    }

    .menu-item {
      display: flex;
      align-items: center;
      padding: var(--space-4) var(--space-5);
      gap: var(--space-4);
      cursor: pointer;
      transition: background var(--motion-fast) var(--ease-standard);
    }

    .menu-item:hover {
      background: rgba(0, 0, 0, 0.02);
    }

    .menu-item + .menu-item {
      border-top: 1px solid var(--border);
    }

    .menu-icon {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .menu-icon.blue {
      background: var(--gradient-soft);
      color: var(--accent);
    }

    .menu-icon.gray {
      background: rgba(102, 112, 133, 0.1);
      color: var(--muted);
    }

    .menu-label {
      flex: 1;
      font-size: var(--text-base);
      font-weight: 500;
    }

    .menu-arrow {
      color: var(--muted);
      flex-shrink: 0;
    }

    .logout-btn {
      width: 100%;
      padding: var(--space-4);
      border-radius: var(--radius-xl);
      background: var(--danger-soft);
      border: none;
      color: var(--danger);
      font-size: var(--text-base);
      font-weight: 600;
      cursor: pointer;
      transition: background var(--motion-base) var(--ease-standard);
    }

    .logout-btn:hover {
      background: rgba(239, 68, 68, 0.12);
    }

    .tab-bar {
      position: absolute;
      bottom: 34px;
      left: 0;
      right: 0;
      height: 84px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      justify-content: space-around;
      align-items: flex-start;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }

    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--muted);
      text-decoration: none;
      font-size: var(--text-xs);
      transition: color var(--motion-base) var(--ease-standard);
    }

    .tab-item.active {
      color: var(--accent);
    }

    .tab-icon {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .page-nav {
      display: flex;
      justify-content: center;
      gap: var(--space-4);
      margin-top: var(--space-6);
      padding-top: var(--space-6);
      border-top: 1px solid var(--border);
    }

    .nav-btn {
      padding: var(--space-3) var(--space-5);
      border-radius: var(--radius-pill);
      font-size: var(--text-sm);
      font-weight: 500;
      text-decoration: none;
      color: var(--fg-2);
      background: var(--surface);
      border: 1px solid var(--border);
      transition: all var(--motion-base) var(--ease-standard);
    }

    .nav-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .nav-btn.active {
      background: var(--gradient-soft);
      color: var(--accent);
      border-color: transparent;
      font-weight: 600;
    }

    @media (max-width: 430px) {
      .phone-container {
        width: 100%;
        height: 100vh;
        border-radius: 0;
        box-shadow: none;
      }
    }
  </style>
</head>
