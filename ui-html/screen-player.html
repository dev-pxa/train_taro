        :root {

            --primary-end: #7c6efc;
            --primary-gradient: linear-gradient(135deg, #4f8ef7, #7c6efc);
            --bg: #f8f9fb;
            --surface: #ffffff;
            --fg: #1a1a1a;
            --muted: #8e8e93;
            --border: #e5e5ea;
            --text-secondary: #6b7280;
            --success: #10b981;
            --danger: #ef4444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'SF Pro Display', 'SF Pro Text', system-ui, sans-serif;
            background: var(--bg);
            min-height: 100vh;
            color: var(--fg);
            -webkit-font-smoothing: antialiased;
        }

        /* 手机框架 */
        .phone-frame {
            width: 390px;
            height: 844px;
            margin: 0 auto;
            background: #000;
            border-radius: 50px;
            padding: 12px;
            box-shadow: 0 50px 100px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        .phone-frame::before {
            content: '';
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 32px;
            background: #000;
            border-radius: 0 0 20px 20px;
            z-index: 100;
        }

        .phone-screen {
            width: 100%;
            height: 100%;
            background: var(--bg);
            border-radius: 40px;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* 安全区域 */
        .safe-top {
            height: 54px;
        }

        .safe-bottom {
            height: 34px;
        }

        /* 播放器区域 */
        .player-section {
            position: relative;
            background: #000;
            aspect-ratio: 16/9;
        }

        .player-cover {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.6;
        }

        /* 返回按钮 */
        .back-btn {
            position: absolute;
            top: 54px;
            left: 16px;
            width: 40px;
            height: 40px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            z-index: 10;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            background: rgba(0, 0, 0, 0.6);
            transform: scale(1.05);
        }

        .back-btn svg {
            width: 22px;
            height: 22px;
        }

        /* 播放按钮 */
        .play-center {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
        }

        .play-btn {
            width: 72px;
            height: 72px;
            background: var(--primary-gradient);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            box-shadow: 0 10px 30px rgba(79, 142, 247, 0.4);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .play-btn:hover {
            transform: scale(1.1);
        }

        .play-btn svg {
            width: 28px;
            height: 28px;
            margin-left: 3px;
        }

        /* 进度条区域 */
        .progress-area {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 16px;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.85), transparent);
        }

        .progress-bar-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .time-label {
            font-size: 11px;
            color: #fff;
            font-weight: 500;
            min-width: 40px;
        }

        .progress-track {
            flex: 1;
            height: 4px;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 2px;
            position: relative;
            cursor: pointer;
        }

        .progress-fill {
            width: 57%;
            height: 100%;
            background: var(--primary-gradient);
            border-radius: 2px;
        }

        .progress-dot {
            position: absolute;
            top: -2px;
            width: 8px;
            height: 8px;
            background: #fbbf24;
            border-radius: 50%;
        }

        .progress-dot.dot-1 { left: 25%; }
        .progress-dot.dot-2 { left: 75%; }

        .player-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 14px;
        }

        .controls-left {
            display: flex;
            gap: 20px;
        }

        .controls-left svg {
            width: 24px;
            height: 24px;
            color: rgba(255, 255, 255, 0.9);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .controls-left svg:hover {
            color: #fff;
            transform: scale(1.1);
        }

        .controls-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .control-pill {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            color: #fff;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .control-pill:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        .controls-right svg {
            width: 22px;
            height: 22px;
            color: rgba(255, 255, 255, 0.9);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .controls-right svg:hover {
            color: #fff;
            transform: scale(1.1);
        }

        /* 课程简介 */
        .course-info {
            padding: 20px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
        }

        .course-title {
            font-size: 17px;
            font-weight: 700;
            color: var(--fg);
            line-height: 1.4;
        }

        .course-highlight {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 6px;
            line-height: 1.5;
        }

        .course-actions {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        .action-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
        }

        .action-btn.primary {
            background: var(--primary-gradient);
            color: #fff;
            box-shadow: 0 4px 15px rgba(79, 142, 247, 0.3);
        }

        .action-btn.primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(79, 142, 247, 0.4);
        }

        .action-btn.secondary {
            background: #fff;
            color: var(--fg);
            border: 1.5px solid var(--border);
        }

        .action-btn.secondary:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .action-btn svg {
            width: 18px;
            height: 18px;
        }

        /* 标签切换 */
        .tabs-section {
            display: flex;
            padding: 0 20px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            position: relative;
        }

        .tab-item {
            padding: 14px 0;
            font-size: 14px;
            font-weight: 600;
            color: var(--muted);
            cursor: pointer;
            position: relative;
            margin-right: 28px;
            transition: all 0.2s ease;
        }

        .tab-item.active {
            color: var(--fg);
        }

        .tab-item.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--primary-gradient);
            border-radius: 2px;
        }

        .tab-badge {
            display: inline-block;
            margin-left: 4px;
            font-size: 12px;
            color: var(--muted);
        }

        /* 目录列表 */
        .catalog-section {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
            background: var(--surface);
        }

        .catalog-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 0;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .catalog-item + .catalog-item {
            border-top: 1px solid var(--border);
        }

        .catalog-index {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            flex-shrink: 0;
        }

        .catalog-item.playing .catalog-index {
            background: linear-gradient(135deg, rgba(79, 142, 247, 0.12), rgba(124, 110, 252, 0.12));
            color: var(--primary);
        }

        .catalog-item.completed .catalog-index {
            background: var(--bg);
            color: var(--muted);
        }

        .catalog-item.locked .catalog-index {
            background: var(--bg);
            color: var(--muted);
        }

        .catalog-content {
            flex: 1;
            min-width: 0;
        }

        .catalog-name {
            font-size: 14px;
            font-weight: 600;
            line-height: 1.4;
        }

        .catalog-item.playing .catalog-name {
            color: var(--primary);
        }

        .catalog-item.completed .catalog-name,
        .catalog-item.locked .catalog-name {
            color: var(--fg);
        }

        .catalog-meta {
            font-size: 11px;
            margin-top: 4px;
        }

        .catalog-item.playing .catalog-meta {
            color: var(--primary);
            opacity: 0.8;
        }

        .catalog-item.completed .catalog-meta,
        .catalog-item.locked .catalog-meta {
            color: var(--muted);
        }

        .catalog-icon {
            flex-shrink: 0;
        }

        .catalog-icon svg {
            width: 26px;
            height: 26px;
        }

        .catalog-item.playing .catalog-icon svg {
            color: var(--primary);
        }

        .catalog-item.completed .catalog-icon svg,
        .catalog-item.locked .catalog-icon svg {
            color: #d1d5db;
        }

        /* 隐藏滚动条 */
        .catalog-section::-webkit-scrollbar {
            display: none;
        }

        .catalog-section {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* 总览页样式 */
        body.overview {
            background: var(--bg);
            padding: 40px 20px;
        }

        .overview-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .overview-title {
            font-size: 28px;
            font-weight: 700;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .screen-nav {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .screen-nav-btn {
            padding: 10px 18px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            background: var(--surface);
            color: var(--muted);
        }

        .screen-nav-btn:hover {
            background: var(--bg);
        }

        .screen-nav-btn.active {
            background: var(--primary-gradient);
            color: #fff;
        }

        .phone-frame-wrap {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .phone-frame-card {
            text-align: center;
        }

        .phone-frame-label {
            margin-top: 16px;
            font-size: 14px;
            color: var(--muted);
            font-weight: 500;
        }

        /* 隐藏总览元素在单页面时 */
        .phone-frame:not(.overview-mode) .overview-only {
            display: none;
        }
    </style>

                tab.classList.add('active');

        });

        // 目录项点击
        document.querySelectorAll('.catalog-item').forEach(item => {
            item.addEventListener('click', () => {
                if (item.classList.contains('locked')) return;

                document.querySelectorAll('.catalog-item').forEach(i => {
                    i.classList.remove('playing');
                    if (!i.classList.contains('locked')) {
