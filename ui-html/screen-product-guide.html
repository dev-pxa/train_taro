<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>企训通 - 产品说明</title>
    <script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-start: #4f8ef7;
            --primary-end: #7c6efc;
            --bg: #f8f9fb;
            --surface: #ffffff;
            --fg: #1a1a2e;
            --fg-2: #4b5563;
            --muted: #8a8a9a;
            --border: #e8e8f0;
            --success: #14c9a5;
            --warning: #ffb020;
            --danger: #ff5a5a;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'SF Pro Text', system-ui, sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--fg);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        button,
        a {
            font: inherit;
            -webkit-tap-highlight-color: transparent;
        }

        button {
            appearance: none;
            border: 0;
            background: none;
        }

        .phone-frame {
            width: 375px;
            height: 812px;
            background: var(--bg);
            border-radius: 40px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12);
            display: flex;
            flex-direction: column;
        }

        .status-bar {
            height: 44px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            background: var(--surface);
            flex-shrink: 0;
        }

        .status-time {
            font-size: 15px;
            font-weight: 600;
            color: var(--fg);
        }

        .status-icons {
            display: flex;
            gap: 5px;
            align-items: center;
            color: var(--fg);
        }

        .header {
            height: 62px;
            padding: 8px 20px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--surface);
            flex-shrink: 0;
        }

        .back-btn,
        .search-btn {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: var(--bg);
            color: var(--fg);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .back-btn:focus-visible,
        .search-btn:focus-visible,
        .side-tab:focus-visible,
        .sort-btn:focus-visible,
        .chip:focus-visible,
        .product-card:focus-visible,
        .clear-search:focus-visible,
        .retry-btn:focus-visible {
            outline: none;
            box-shadow: 0 0 0 3px rgba(79, 142, 247, 0.18);
        }

        .page-title {
            font-size: 17px;
            font-weight: 850;
            color: var(--fg);
        }

        .search-panel {
            display: none;
            gap: 10px;
            align-items: center;
            padding: 0 20px 14px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .phone-frame.searching .search-panel {
            display: flex;
        }

        .search-field {
            flex: 1;
            min-width: 0;
            height: 42px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 12px;
            border-radius: 14px;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--muted);
        }

        .search-field:focus-within {
            border-color: color-mix(in oklab, var(--primary-start), transparent 35%);
            box-shadow: 0 0 0 3px rgba(79, 142, 247, 0.12);
        }

        .search-field input {
            width: 100%;
            min-width: 0;
            border: 0;
            outline: none;
            background: transparent;
            color: var(--fg);
            font-size: 13px;
            font-weight: 700;
        }

        .search-field input::placeholder {
            color: var(--muted);
            font-weight: 650;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .clear-search {
            width: 42px;
            height: 42px;
            border-radius: 14px;
            background: var(--bg);
            color: var(--fg-2);
            font-size: 13px;
            font-weight: 850;
            cursor: pointer;
        }

        .layout {
            flex: 1;
            min-height: 0;
            display: grid;
            grid-template-columns: 86px 1fr;
            overflow: hidden;
        }

        .side-tabs {
            border-right: 1px solid var(--border);
            background: color-mix(in oklab, var(--bg), var(--surface) 55%);
            overflow-y: auto;
            padding: 14px 0 22px;
            -webkit-overflow-scrolling: touch;
        }

        .side-tab {
            width: 100%;
            min-height: 54px;
            padding: 0 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--fg-2);
            font-size: 14px;
            font-weight: 750;
            line-height: 1.25;
            cursor: pointer;
            position: relative;
        }

        .side-tab.active {
            color: var(--primary-start);
            background: var(--surface);
        }

        .side-tab.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 15px;
            bottom: 15px;
            width: 4px;
            border-radius: 0 999px 999px 0;
            background: linear-gradient(180deg, var(--primary-start), var(--primary-end));
        }

        .side-tab-badge {
            margin-left: 4px;
            padding: 2px 5px;
            border-radius: 999px;
            color: var(--danger);
            background: rgba(255, 90, 90, 0.1);
            font-size: 9px;
            font-weight: 900;
            line-height: 1;
        }

        .main-pane {
            min-width: 0;
            overflow-y: auto;
            padding: 14px 16px 24px;
            -webkit-overflow-scrolling: touch;
        }

        .filter-bar {
            position: sticky;
            top: 0;
            z-index: 4;
            margin: -14px -16px 12px;
            padding: 12px 16px 10px;
            background: color-mix(in oklab, var(--bg), var(--surface) 72%);
            border-bottom: 1px solid var(--border);
        }

        .sort-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 10px;
        }

        .sort-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            color: var(--muted);
            font-size: 12px;
            font-weight: 760;
            cursor: pointer;
        }

        .sort-btn.active {
            color: var(--primary-start);
        }

        .chip-row {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 2px;
            scrollbar-width: none;
        }

        .chip-row::-webkit-scrollbar {
            display: none;
        }

        .chip {
            flex: 0 0 auto;
            padding: 7px 11px;
            border-radius: 12px;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--fg-2);
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
        }

        .chip.active {
            color: var(--primary-start);
            border-color: color-mix(in oklab, var(--primary-start), transparent 55%);
            background: color-mix(in oklab, var(--primary-start), transparent 90%);
        }

        .series-title {
            font-size: 18px;
            font-weight: 900;
            letter-spacing: -0.01em;
        }

        .series-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 10px;
            margin: 4px 0 10px;
        }

        .result-count {
            flex: 0 0 auto;
            color: var(--muted);
            font-size: 12px;
            font-weight: 800;
        }

        .product-list {
            display: block;
            border-radius: 20px;
            background: var(--surface);
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .product-list:empty {
            display: none;
        }

        .product-card {
            display: grid;
            grid-template-columns: 74px minmax(0, 1fr) 18px;
            gap: 12px;
            align-items: center;
            min-height: 128px;
            padding: 14px 12px;
            border-bottom: 1px solid var(--border);
            color: var(--fg);
            text-decoration: none;
            transition: background 0.16s ease, transform 0.16s ease;
        }

        .product-card:last-child {
            border-bottom: 0;
        }

        .product-card:active {
            transform: translateY(1px);
        }

        .product-card:hover {
            background: color-mix(in oklab, var(--bg), var(--surface) 54%);
        }

        .product-visual {
            width: 74px;
            height: 82px;
            border-radius: 16px;
            background: color-mix(in oklab, var(--bg), var(--surface) 38%);
            border: 1px solid color-mix(in oklab, var(--border), var(--surface) 45%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .product-image {
            width: 66px;
            height: 66px;
            object-fit: contain;
            display: block;
            filter: saturate(0.98);
        }

        .product-brand {
            position: absolute;
            left: 7px;
            top: 7px;
            padding: 3px 5px;
            border-radius: 7px;
            background: color-mix(in oklab, var(--primary-start), transparent 88%);
            color: var(--primary-start);
            font-size: 11px;
            font-weight: 900;
        }

        .product-name {
            font-size: 14px;
            line-height: 1.3;
            font-weight: 900;
            margin-bottom: 7px;
            overflow-wrap: anywhere;
        }

        .product-copy {
            min-width: 0;
        }

        .product-desc {
            font-size: 12px;
            line-height: 1.45;
            color: var(--muted);
            font-weight: 650;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .tag-row {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 9px;
        }

        .tag {
            padding: 4px 7px;
            border-radius: 8px;
            background: var(--bg);
            color: var(--primary-start);
            font-size: 10px;
            font-weight: 850;
            line-height: 1;
        }

        .arrow {
            color: var(--muted);
            font-size: 20px;
            display: flex;
            justify-content: flex-end;
        }

        .loading-list {
            display: none;
            gap: 10px;
        }

        .loading-list.show {
            display: grid;
        }

        .loading-card {
            min-height: 116px;
            border-radius: 18px;
            border: 1px solid var(--border);
            background:
                linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.72), transparent),
                color-mix(in oklab, var(--surface), var(--bg) 30%);
            background-size: 180% 100%, 100% 100%;
            animation: shimmer 1.1s linear infinite;
        }

        @keyframes shimmer {
            from { background-position: 180% 0, 0 0; }
            to { background-position: -180% 0, 0 0; }
        }

        .state-card {
            display: none;
            margin-top: 6px;
            padding: 28px 14px;
            border-radius: 22px;
            border: 1px dashed var(--border);
            background: var(--surface);
            text-align: center;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.55;
            font-weight: 700;
        }

        .state-card.show {
            display: block;
        }

        .state-icon {
            width: 48px;
            height: 48px;
            margin: 0 auto 12px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(79, 142, 247, 0.1);
            color: var(--primary-start);
            font-size: 24px;
        }

        .state-title {
            margin-bottom: 4px;
            color: var(--fg);
            font-size: 15px;
            font-weight: 900;
        }

        .retry-btn {
            margin-top: 12px;
            min-height: 40px;
            padding: 0 14px;
            border-radius: 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--fg);
            font-size: 13px;
            font-weight: 850;
            cursor: pointer;
        }

        .home-indicator {
            height: 22px;
            background: var(--surface);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 8px;
            flex-shrink: 0;
        }

        .home-indicator::after {
            content: '';
            width: 134px;
            height: 5px;
            background: var(--border);
            border-radius: 100px;
        }

        @media (max-width: 430px) {
            body {
                padding: 0;
            }

            .phone-frame {
                width: 100vw;
                height: 100vh;
                border-radius: 0;
                box-shadow: none;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <div class="phone-frame" id="phoneFrame">
        <div class="status-bar">
            <div class="status-time">9:41</div>
            <div class="status-icons">
                <span class="iconify" data-icon="solar:signal-linear"></span>
                <span class="iconify" data-icon="solar:wifi-linear"></span>
                <span class="iconify" data-icon="solar:battery-full-linear"></span>
            </div>
        </div>

        <header class="header" data-od-id="product-guide-header">
            <button class="back-btn" type="button" aria-label="返回首页" onclick="window.location.href='screen-home.html'">
                <span class="iconify" data-icon="solar:alt-arrow-left-linear" style="font-size: 22px;"></span>
            </button>
            <div class="page-title">产品说明</div>
            <button class="search-btn" id="searchToggle" type="button" aria-label="搜索产品" aria-expanded="false" aria-controls="searchPanel">
                <span class="iconify" data-icon="solar:magnifer-linear" style="font-size: 22px;"></span>
            </button>
        </header>

        <div class="search-panel" id="searchPanel" data-od-id="product-guide-search">
            <label class="search-field" for="searchInput">
                <span class="sr-only">搜索产品</span>
                <span class="iconify" data-icon="solar:magnifer-linear"></span>
                <input id="searchInput" type="search" placeholder="搜索型号、能力或场景" autocomplete="off">
            </label>
            <button class="clear-search" id="clearSearch" type="button">清空</button>
        </div>

        <main class="layout" data-od-id="product-guide-layout">
            <aside class="side-tabs" data-od-id="product-guide-side-tabs" aria-label="产品分类">
                <button class="side-tab active" type="button" data-category="all" aria-pressed="true">全部</button>
                <button class="side-tab" type="button" data-category="gateway" aria-pressed="false">网关</button>
                <button class="side-tab" type="button" data-category="wireless" aria-pressed="false">无线</button>
                <button class="side-tab" type="button" data-category="security" aria-pressed="false">安防</button>
                <button class="side-tab" type="button" data-category="switch" aria-pressed="false">开关</button>
                <button class="side-tab" type="button" data-category="sensor" aria-pressed="false">传感器</button>
                <button class="side-tab" type="button" data-category="light" aria-pressed="false">照明<span class="side-tab-badge">NEW</span></button>
                <button class="side-tab" type="button" data-category="energy" aria-pressed="false">能源</button>
            </aside>

            <section class="main-pane" data-od-id="product-guide-main-pane">
                <div class="filter-bar" data-od-id="product-guide-filter">
                    <div class="sort-row">
                        <button class="sort-btn active" type="button" data-sort="default" aria-pressed="true">
                            综合
                            <span class="iconify" data-icon="solar:alt-arrow-down-linear"></span>
                        </button>
                        <button class="sort-btn" type="button" data-sort="new" aria-pressed="false">新品</button>
                        <button class="sort-btn" type="button" data-sort="hot" aria-pressed="false">热门</button>
                        <button class="sort-btn" id="filterHint" type="button">
                            筛选
                            <span class="iconify" data-icon="solar:filter-linear"></span>
                        </button>
                    </div>
                    <div class="chip-row" aria-label="二级筛选">
                        <button class="chip active" type="button" data-type="all" aria-pressed="true">全部</button>
                        <button class="chip" type="button" data-type="ap" aria-pressed="false">吸顶 AP</button>
                        <button class="chip" type="button" data-type="panel" aria-pressed="false">面板</button>
                        <button class="chip" type="button" data-type="lock" aria-pressed="false">门锁</button>
                        <button class="chip" type="button" data-type="gateway" aria-pressed="false">中枢</button>
                    </div>
                </div>

                <div class="series-head">
                    <h1 class="series-title" id="seriesTitle">全部产品</h1>
                    <div class="result-count" id="resultCount" aria-live="polite">6 款</div>
                </div>
                <div class="loading-list" id="loadingState" aria-hidden="true">
                    <div class="loading-card"></div>
                    <div class="loading-card"></div>
                    <div class="loading-card"></div>
                </div>
                <div class="product-list" id="productList" data-od-id="product-guide-list"></div>
                <div class="state-card" id="emptyState" role="status">
                    <div class="state-icon">
                        <span class="iconify" data-icon="solar:box-minimalistic-linear"></span>
                    </div>
                    <div class="state-title">没有匹配产品</div>
                    <p>当前筛选下暂无产品，请切换分类或清空搜索条件。</p>
                </div>
                <div class="state-card" id="errorState" role="alert">
                    <div class="state-icon">
                        <span class="iconify" data-icon="solar:danger-triangle-linear"></span>
                    </div>
                    <div class="state-title">产品数据暂时不可用</div>
                    <p>请稍后重试，或联系培训管理员确认产品资料状态。</p>
                    <button class="retry-btn" id="retryButton" type="button">重新加载</button>
                </div>
            </section>
        </main>

        <div class="home-indicator"></div>
    </div>

    <script>
        const products = [
            {
                category: 'wireless',
                type: 'ap',
                name: 'RG-EAP262(G) V2',
                image: 'assets/product-ap-262.png',
                desc: '支持 Wi-Fi 6，最大接入速率 1775Mbps，推荐接入终端 64 台。',
                tags: ['热销', '1 类保卡']
            },
            {
                category: 'wireless',
                type: 'ap',
                name: 'RG-EAP262(E)',
                image: 'assets/product-ap-262e.png',
                desc: '支持 160M 频宽，整机最大无线速率 2976Mbps，适合高密度办公。',
                tags: ['Wi-Fi 6', '保修 1 年']
            },
            {
                category: 'wireless',
                type: 'panel',
                name: 'RG-EAP162(E)',
                image: 'assets/product-eap162e.png',
                desc: '8.5 毫米超薄面板设计，适合酒店客房、办公室暗盒安装。',
                tags: ['面板 AP', '千兆口']
            },
            {
                category: 'gateway',
                type: 'gateway',
                name: 'QXT-GW Pro 智能中枢',
                image: 'assets/product-generic-panel.png',
                desc: '支持多协议设备接入，统一管理灯光、安防、环境与能源设备。',
                tags: ['多协议', '本地联动']
            },
            {
                category: 'security',
                type: 'lock',
                name: 'QXT-Lock X3 智能门锁',
                image: 'assets/product-generic-panel.png',
                desc: '支持指纹、密码、NFC 与临时授权，适合家庭和公寓场景。',
                tags: ['安防', '远程授权']
            },
            {
                category: 'sensor',
                type: 'panel',
                name: 'QXT-Sense 环境传感器',
                image: 'assets/product-ap-262.png',
                desc: '采集温湿度、光照和人体存在数据，为自动化策略提供触发条件。',
                tags: ['环境感知', '低功耗']
            }
        ];

        const categoryNames = {
            all: '全部产品',
            gateway: '网关',
            wireless: '无线',
            security: '安防',
            switch: '开关',
            sensor: '传感器',
            light: '照明',
            energy: '能源'
        };

        let activeCategory = 'all';
        let activeType = 'all';
        let activeSort = 'default';
        let searchQuery = '';
        let renderTimer;

        const phoneFrame = document.getElementById('phoneFrame');
        const searchToggle = document.getElementById('searchToggle');
        const searchInput = document.getElementById('searchInput');
        const clearSearch = document.getElementById('clearSearch');
        const productList = document.getElementById('productList');
        const emptyState = document.getElementById('emptyState');
        const loadingState = document.getElementById('loadingState');
        const errorState = document.getElementById('errorState');
        const resultCount = document.getElementById('resultCount');
        const seriesTitle = document.getElementById('seriesTitle');
        const sideTabs = document.querySelectorAll('.side-tab');
        const chips = document.querySelectorAll('.chip');
        const sortButtons = document.querySelectorAll('.sort-btn[data-sort]');
        const filterHint = document.getElementById('filterHint');
        const retryButton = document.getElementById('retryButton');

        function getFilteredProducts() {
            const query = searchQuery.trim().toLowerCase();
            const filtered = products.filter((product) => {
                const matchCategory = activeCategory === 'all' || product.category === activeCategory;
                const matchType = activeType === 'all' || product.type === activeType;
                const searchable = [product.name, product.desc, ...product.tags].join(' ').toLowerCase();
                const matchQuery = !query || searchable.includes(query);
                return matchCategory && matchType && matchQuery;
            });

            if (activeSort === 'new') {
                return [...filtered].reverse();
            }

            if (activeSort === 'hot') {
                return [...filtered].sort((a, b) => Number(b.tags.includes('热销')) - Number(a.tags.includes('热销')));
            }

            return filtered;
        }

        function paintProducts(filtered) {
            loadingState.classList.remove('show');
            loadingState.setAttribute('aria-hidden', 'true');
            errorState.classList.remove('show');
            seriesTitle.textContent = categoryNames[activeCategory] || '产品';
            resultCount.textContent = `${filtered.length} 款`;
            emptyState.classList.toggle('show', filtered.length === 0);
            productList.innerHTML = filtered.map((product, index) => `
                <a class="product-card" href="screen-product-detail.html" data-od-id="product-card-${index + 1}" aria-label="查看${product.name}详情">
                    <div class="product-visual">
                        <span class="product-brand">易</span>
                        <img class="product-image" src="${product.image}" alt="${product.name} 产品图" loading="lazy">
                    </div>
                    <div class="product-copy">
                        <div class="product-name">${product.name}</div>
                        <div class="product-desc">${product.desc}</div>
                        <div class="tag-row">
                            ${product.tags.map((tag) => `<span class="tag">${tag}</span>`).join('')}
                        </div>
                    </div>
                    <div class="arrow">
                        <span class="iconify" data-icon="solar:alt-arrow-right-linear"></span>
                    </div>
                </a>
            `).join('');
        }

        function renderProducts({ withLoading = false } = {}) {
            clearTimeout(renderTimer);
            const filtered = getFilteredProducts();

            if (!withLoading) {
                paintProducts(filtered);
                return;
            }

            productList.innerHTML = '';
            emptyState.classList.remove('show');
            errorState.classList.remove('show');
            loadingState.classList.add('show');
            loadingState.setAttribute('aria-hidden', 'false');
            resultCount.textContent = '加载中';
            renderTimer = setTimeout(() => paintProducts(filtered), 180);
        }

        function setPressed(items, activeItem) {
            items.forEach((item) => item.setAttribute('aria-pressed', String(item === activeItem)));
        }

        sideTabs.forEach((tab) => {
            tab.addEventListener('click', () => {
                sideTabs.forEach((item) => item.classList.remove('active'));
                tab.classList.add('active');
                setPressed(sideTabs, tab);
                activeCategory = tab.dataset.category;
                renderProducts({ withLoading: true });
            });
        });

        chips.forEach((chip) => {
            chip.addEventListener('click', () => {
                chips.forEach((item) => item.classList.remove('active'));
                chip.classList.add('active');
                setPressed(chips, chip);
                activeType = chip.dataset.type;
                renderProducts({ withLoading: true });
            });
        });

        sortButtons.forEach((button) => {
            button.addEventListener('click', () => {
                sortButtons.forEach((item) => item.classList.remove('active'));
                button.classList.add('active');
                setPressed(sortButtons, button);
                activeSort = button.dataset.sort;
                renderProducts({ withLoading: true });
            });
        });

        searchToggle.addEventListener('click', () => {
            const isSearching = phoneFrame.classList.toggle('searching');
            searchToggle.setAttribute('aria-expanded', String(isSearching));
            if (isSearching) {
                searchInput.focus();
            }
        });

        searchInput.addEventListener('input', () => {
            searchQuery = searchInput.value;
            renderProducts();
        });

        clearSearch.addEventListener('click', () => {
            searchInput.value = '';
            searchQuery = '';
            renderProducts();
            searchInput.focus();
        });

        filterHint.addEventListener('click', () => {
            chips[0].focus();
        });

        retryButton.addEventListener('click', () => {
            renderProducts({ withLoading: true });
        });

        renderProducts();
    </script>
</body>
</html>
