services:
  train-taro-h5:
    build:
      context: .
      dockerfile: Dockerfile
    image: train-taro-h5:latest
    container_name: train-taro-h5
    restart: unless-stopped
    ports:
      - "${H5_HTTP_PORT:-80}:80"
    environment:
      BACKEND_UPSTREAM: ${BACKEND_UPSTREAM:-host.docker.internal:8082}
    extra_hosts:
      - "host.docker.internal:host-gateway"
