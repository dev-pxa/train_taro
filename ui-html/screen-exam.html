        .phone-frame {

        .status-bar {

            background: var(--border);
        }

            border: 1px solid rgba(255, 176, 32, 0.18);

            flex-direction: column;
            gap: 12px;

            background: rgba(79, 142, 247, 0.02);
        }

            border-color: var(--primary-start);
            background: linear-gradient(135deg, rgba(79, 142, 247, 0.08), rgba(124, 110, 252, 0.04));

            height: 40px;
            border-radius: 12px;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 700;
            color: var(--muted);
            flex-shrink: 0;
            transition: all 0.2s;

            box-shadow: 0 6px 20px rgba(79, 142, 247, 0.3);
        }

        .option-text {
            flex: 1;
            font-size: 14px;
            line-height: 1.5;
            color: var(--fg);
            font-weight: 500;
        }

        .option.selected .option-text {
            font-weight: 600;
        }

        .option-check {
            color: var(--success);
            font-size: 24px;
            flex-shrink: 0;
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.2s;
        }

        .option.selected .option-check {
            opacity: 1;
            transform: scale(1);
        }

        .bottom {

            background: var(--surface);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 12px;
        }

        .btn {
            flex: 1;
            height: 52px;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-secondary {
            background: var(--bg);
            color: var(--muted);
        }

        .btn-secondary:hover {
            background: var(--border);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-start), var(--primary-end));
            color: white;
            box-shadow: 0 8px 24px rgba(79, 142, 247, 0.35);
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 28px rgba(79, 142, 247, 0.4);
        }

        /* Home Indicator */
        .home-indicator {
            height: 8px;
            background: var(--surface);
            display: flex;
            justify-content: center;
            padding-bottom: 4px;
        }

        .home-indicator::after {
            content: '';
            width: 134px;
            height: 5px;
            background: #c8c7cc;
            border-radius: 100px;
        }
