        .phone-frame {

        .back-btn:hover {

        .timer {

            border: 1px solid rgba(255, 90, 90, 0.15);
        }

        .timer-icon {
            color: var(--danger);
            font-size: 18px;

        .timer-text {
            font-size: 14px;
            font-weight: 700;
            color: var(--danger);
            letter-spacing: 0.5px;
        }

        .progress {
            font-size: 12px;
            font-weight: 600;
            color: var(--muted);

            padding: 6px 12px;
            border-radius: 14px;

        .warning-banner {
            margin: 0 16px 16px;
            padding: 10px 14px;

            border: 1px solid rgba(255, 176, 32, 0.18);
            display: flex;
            align-items: center;

            color: var(--warning);

            display: flex;
            align-items: center;

            font-size: 12px;

            font-weight: 500;

            color: var(--fg);
            margin-bottom: 28px;

            appearance: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;

            border: 2px solid rgba(79, 142, 247, 0.3);
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            font-family: inherit;
            line-height: 1;
            color: var(--primary-start);
            transition: all 0.2s;
            vertical-align: 2px;
            cursor: pointer;

        .blank-marker:focus {
            border-color: var(--primary-start);
            box-shadow: 0 0 0 4px rgba(79, 142, 247, 0.15);
            background: linear-gradient(135deg, rgba(79, 142, 247, 0.12), rgba(124, 110, 252, 0.06));
            outline: none;
        }

        .blank-marker.filled {
            border-color: var(--primary-start);
            color: var(--surface);
            background: linear-gradient(135deg, var(--primary-start), var(--primary-end));
            box-shadow: 0 6px 16px rgba(79, 142, 247, 0.22);
        }

        .fill-answer-area {
            background: var(--bg);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .fill-answer-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--muted);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .fill-answer-title .iconify {
            font-size: 16px;
            color: var(--primary-start);
        }

            margin-bottom: 16px;

            margin-bottom: 0;

        .fill-blank-label {
            font-size: 13px;
            font-weight: 500;
            color: var(--fg);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;

        .fill-blank-index {
            width: 24px;
            height: 24px;
            border-radius: 8px;

            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;

            background: var(--surface);
            border: 2px solid var(--border);

            top: 50%;

            color: var(--muted);

            align-items: center;
            gap: 4px;

            gap: 12px;

            height: 52px;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 600;
            border: none;

            display: flex;
            align-items: center;
            justify-content: center;

        .btn-secondary {

            color: var(--muted);

        .btn-secondary:hover {
            background: var(--border);
        }

        .btn-primary {

            box-shadow: 0 8px 24px rgba(79, 142, 247, 0.35);

        }

        .home-indicator {
            height: 8px;
            background: var(--surface);
            display: flex;
            justify-content: center;
            padding-bottom: 4px;
        }

        .home-indicator::after {
            content: '';
            width: 134px;
            height: 5px;
            background: #c8c7cc;
            border-radius: 100px;
        }

        /* Exit Modal */
        .exit-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }

        .exit-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .exit-modal {
            background: var(--surface);
            border-radius: 28px;
            padding: 32px 24px 24px;
            width: 100%;
            max-width: 335px;
            text-align: center;
            transform: translateY(20px) scale(0.95);
            opacity: 0;
            transition: all 0.3s;

        .exit-overlay.show .exit-modal {
            transform: translateY(0) scale(1);
            opacity: 1;
        }

        .exit-modal-icon-wrap {
            position: relative;
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
        }

        .exit-modal-icon-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-start), var(--primary-end));
            opacity: 0.15;
        }

        .exit-modal-icon {
            position: absolute;
            width: 56px;
            height: 56px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-start), var(--primary-end));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .exit-modal-icon .iconify {
            font-size: 28px;
            color: var(--warning);
        }

        .exit-modal-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--fg);
            margin-bottom: 8px;
        }

        .exit-modal-desc {
            font-size: 14px;
            color: var(--muted);
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .exit-modal-buttons {
            display: flex;
            gap: 12px;
        }

        .exit-modal-btn {
            flex: 1;
            height: 52px;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .exit-modal-btn-continue {
            background: var(--bg);
            color: var(--fg);
        }

        .exit-modal-btn-continue:hover {
            background: var(--border);
        }

        .exit-modal-btn-leave {
            background: linear-gradient(135deg, var(--primary-start), var(--primary-end));
            color: white;
            box-shadow: 0 8px 24px rgba(79, 142, 247, 0.35);
        }

        .exit-modal-btn-leave:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 28px rgba(79, 142, 247, 0.4);
        }

        /* Decorative elements */
        .exit-modal-decoration {
            position: absolute;
            border-radius: 50%;
            opacity: 0.6;
        }

        .exit-modal-decoration-1 {
            width: 12px;
            height: 12px;
            background: var(--primary-start);
            top: 10px;
            right: 30px;
        }

        .exit-modal-decoration-2 {
            width: 8px;
            height: 8px;
            background: var(--primary-end);
            top: 28px;
            right: 18px;
        }

        .exit-modal-decoration-3 {
            width: 6px;
            height: 6px;
            background: var(--primary-start);
            bottom: 20px;
            left: 24px;
        }

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Blank answer state
            const blanks = ['blank1', 'blank2', 'blank3', 'blank4'];

            blanks.forEach(blankId => {
                const mainInput = document.getElementById(blankId);
                const marker = document.getElementById(blankId + 'Marker');
                const hint = document.getElementById(blankId.replace('blank', 'hint'));

                if (mainInput && marker) {
                    mainInput.addEventListener('input', function() {
                        updateFilledState(this, marker, hint);
                        checkAllFilled();
                    });

                    marker.addEventListener('click', function() {
                        mainInput.focus();
                    });
                }
            });

            function updateFilledState(input, marker, hint) {
                if (input.value.trim()) {
                    input.classList.add('filled');
                    marker.classList.add('filled');
                    if (hint) hint.style.display = 'flex';
                } else {
                    input.classList.remove('filled');
                    marker.classList.remove('filled');
                    if (hint) hint.style.display = 'none';
                }
            }

            function checkAllFilled() {
                const nextBtn = document.getElementById('nextBtn');
                const allFilled = blanks.every(id => {
                    const input = document.getElementById(id);
                    return input && input.value.trim();
                });
                nextBtn.disabled = !allFilled;
            }

            // Exit Modal
            const backBtn = document.getElementById('backBtn');
            const exitOverlay = document.getElementById('exitOverlay');
            const continueBtn = document.getElementById('continueBtn');
            const leaveBtn = document.getElementById('leaveBtn');

            backBtn.addEventListener('click', function() {
                showExitModal();
            });

            continueBtn.addEventListener('click', function() {
                hideExitModal();
            });

            leaveBtn.addEventListener('click', function() {
                hideExitModal();
                // Add leave logic here
            });

            function showExitModal() {
                exitOverlay.classList.add('show');
                document.body.style.overflow = 'hidden';
            }

            function hideExitModal() {
                exitOverlay.classList.remove('show');
                document.body.style.overflow = '';
            }
        });
    </script>
